name: Deploy to AWS

on:
  workflow_dispatch: # for manual triggering

env:
  AWS_REGION: us-east-1

  # New AWS account ECR registry
  ECR_REGISTRY: 561848170666.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: pbs-ai-engine/staging
  IMAGE_TAG: latest

  # ECS deployment settings
  ECS_CLUSTER: pbs-staging
  ECS_SERVICE: pbs-ai-engine

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push PBS Service Docker image to ECR
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
        run: |
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

      - name: Force ECS service deployment
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION